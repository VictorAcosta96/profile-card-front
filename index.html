<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Añade las fuentes aquí -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
  <!-- Actualiza el Title -->
  <title>Profile Card</title>
</head>

<body>

  <article class="card">
    <section class="card__profile">
      <img class="card__img" src="assets/user-image.jpg" alt="user image">
      <h2 class="card__name">Jhon Doe</h2>
      <p class="card__profesion">Web developer</p>

      <a class="card__cta" href="#">Follow</a>
      <a class="card__cta" href="#">Message</a>
    </section>

    <section class="card__stats">
      <div class="card__info">
        <p class="card__number">523</p>
        <p class="card__text">Posts</p>
      </div>
      <div class="card__info">
        <p class="card__number">1364</p>
        <p class="card__text">Likes</p>
      </div>
      <div class="card__info">
        <p class="card__number">146</p>
        <p class="card__text">Followers</p>
      </div>

    </section>

  </article>

</body>

</html>
